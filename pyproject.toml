[project]
name = "bi-agent"
version = "0.1.0"
description = "LLM-driven BI agent for learning schema grounding, evaluation, and business semantics"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.52.0",
    "duckdb>=1.3.0",
    "matplotlib>=3.10.0",
    "pandas>=2.2.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0",
    "rich>=14.0.0",
    "sentence-transformers>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
